# Kubernetes deployment for the Express app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learniken-express-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
      - name: express-app
        image: magneka/learniken-express-app:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"


# Readiness probe configuration for the container
        readinessProbe:
          httpGet:
            path: /readyz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

# Liveness probe configuration for the container
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: learniken-express-app-service
spec:
  type: LoadBalancer
  ports:
  - port: 8082
    targetPort: 80
  selector:
    app: express-app