name: 09_rust_app

services:
  rust_rest:
    build: .
    container_name: rust-rest-api
    ports:
      - "8088:80"
    environment:
      - PORT=80
      - RUST_BACKTRACE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped