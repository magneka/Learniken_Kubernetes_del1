apiVersion: v1
kind: ServiceAccount
metadata:
  name: learniken-koa-scaler
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learniken-koa-scaler
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learniken-koa-scaler
  namespace: default
subjects:
- kind: ServiceAccount
  name: learniken-koa-scaler
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learniken-koa-scaler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learniken-koa-ts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koa-ts-app
  template:
    metadata:
      labels:
        app: koa-ts-app
    spec:
      containers:
      - name: koa-ts-app
        image: magneka/learniken-koa-ts-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        readinessProbe:
          httpGet:
            path: /readyz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: learniken-koa-ts-app-service
spec:
  type: LoadBalancer
  ports:
  - port: 8083
    targetPort: 80
  selector:
    app: koa-ts-app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learniken-koa-scale-up-one
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Oslo"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: learniken-koa-scaler
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: registry.k8s.io/kubectl:v1.31.0
            command: ["kubectl", "scale", "deployment/learniken-koa-ts-app", "--replicas=1"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learniken-koa-scale-up-five
spec:
  schedule: "0 9 * * *"
  timeZone: "Europe/Oslo"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: learniken-koa-scaler
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: registry.k8s.io/kubectl:v1.31.0
            command: ["kubectl", "scale", "deployment/learniken-koa-ts-app", "--replicas=5"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learniken-koa-scale-down-zero
spec:
  schedule: "0 17 * * *"
  timeZone: "Europe/Oslo"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: learniken-koa-scaler
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: registry.k8s.io/kubectl:v1.31.0
            command: ["kubectl", "scale", "deployment/learniken-koa-ts-app", "--replicas=0"]
