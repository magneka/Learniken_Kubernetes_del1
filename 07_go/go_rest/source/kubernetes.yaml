# Kubernetes deployment for the Go app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learniken-go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: magneka/learniken-go-app:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        # Enter stuff here

---
apiVersion: v1
kind: Service
metadata:
  name: learniken-go-app-service
spec:
  type: LoadBalancer
  ports:
  - port: 8086
    targetPort: 80
  selector:
    app: go-app