name: 08_java_spring_boot

services:
  spring_rest:
    build: .
    container_name: spring-rest-api
    ports:
      - "8087:80"
    environment:
      - PORT=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped