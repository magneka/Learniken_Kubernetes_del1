--- 
# Deployment for C# Minimal API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learniken-csharp-app
  labels:
    app: csharp-app
    tier: backend
    language: csharp
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csharp-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: csharp-app
        tier: backend
        language: csharp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 2000
      containers:
      - name: csharp-app
        image: magneka/learniken-csharp-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:80"
        - name: PORT
          value: "80"
        - name: APP_NAME
          value: "CSharp Minimal API"
        - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
          value: "false"
        # Enter stuff here
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      dnsPolicy: ClusterFirst

---
# Service for C# Minimal API
apiVersion: v1
kind: Service
metadata:
  name: learniken-csharp-app-service
  labels:
    app: csharp-app
    tier: backend
    language: csharp
spec:
  type: LoadBalancer
  ports:
  - port: 8085
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: csharp-app
  sessionAffinity: None

